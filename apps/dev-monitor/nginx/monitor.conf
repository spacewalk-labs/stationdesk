location = /monitor {
    absolute_redirect off;
    return 302 /monitor/;
}
# The engine's conventional app URL is also used by doctor and hub tiles.
location = /dev-monitor/ {
    rewrite ^ /monitor/ last;
}
location = /dev-monitor/icon.svg {
    alias ${STATIONDESK_ROOT}/web/dev-monitor/icon.svg;
}
location /monitor/ {
    proxy_set_header Host $http_host;
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT}/;
}

location = /accounts/status.json {
    proxy_set_header Host $http_host;
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT}/accounts/status.json;
}
location = /accounts/action {
    proxy_set_header Host $http_host;
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT}/accounts/action;
}

location /feedback/api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT};
}
