client_max_body_size 0;
location = /stationdesk-porthole.js {
    alias ${STATIONDESK_ROOT}/hub/web/assets/porthole.js;
}
location = /accounts/status.json {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT_HUB};
}
# Porthole needs only card previews; other monitor data stays on the hub.
location /monitor/ { return 404; }
location = /monitor/api/owner/messages/preview {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT_HUB};
}
location /airlock-ui-state/ {
    proxy_pass http://127.0.0.1:19954/;
    proxy_http_version 1.1;
    proxy_set_header Host $$host;
}
location /browse-view/ {
    proxy_pass http://127.0.0.1:19955;
    proxy_http_version 1.1;
    proxy_set_header Host $$host;
    proxy_set_header Upgrade $$http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
}
location / {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host ${STATIONDESK_FQDN}:19950;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $$http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_set_header Accept-Encoding "";
    sub_filter '</body>' '<script src="/stationdesk-porthole.js" data-hub-url="https://${STATIONDESK_FQDN}" defer></script></body>';
    sub_filter_once on;
}
