<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
  <title>Bench</title>
  <link id="favicon" rel="icon" type="image/png" href="/icon.png">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#262626}
    iframe{display:block;border:0;transform-origin:0 0}
    #hint{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2;max-width:calc(100% - 16px);display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:999px;background:#141719e6;color:#eef1ed;font:12px/1.4 system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    #hint[hidden]{display:none}
    #hint a{color:#cedfb0}
    #hint button{width:28px;height:28px;padding:0;border:0;border-radius:50%;background:#30373a;color:inherit;font:inherit;cursor:pointer}
  </style>
</head>
<body>
  <iframe title="Bench editor" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  <div id="hint">
    <span>두 손가락으로 확대·이동하세요.<a id="back" href="/"> 편집기 목록으로 돌아가기</a></span>
    <button type="button" aria-label="안내 닫기">×</button>
  </div>
  <script>
    const frame = document.querySelector('iframe');
    const hint = document.getElementById('hint');
    const app = new URLSearchParams(location.search).get('app');
    const icon = document.getElementById('favicon');
    frame.src = '/' + encodeURIComponent(app) + '/';
    icon.href = '/icons/' + encodeURIComponent(app) + '.png';
    // Inside the Bench shell the sidebar already is the way back.
    if (window.top !== window.self) hint.querySelector('a').remove();
    hint.querySelector('button').onclick = () => { hint.hidden = true; };
    setTimeout(() => { hint.hidden = true; }, 12000);
    fetch('/apps.json').then(r => r.json()).then(list => {
      const found = list.apps.find(a => a.id === app);
      if (found) document.title = found.name + ' — Bench';
    }).catch(() => {});
    function fit() {
      const scale = innerWidth / 1440;
      frame.style.width = '1440px';
      frame.style.height = (innerHeight / scale) + 'px';
      frame.style.transform = 'scale(' + scale + ')';
    }
    fit();
    addEventListener('resize', fit);
  </script>
</body>
</html>
