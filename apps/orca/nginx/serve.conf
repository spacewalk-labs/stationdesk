# Orca owner gate (the engine adds the owner check for this whole server).
# Serves the patched web client at /orca-web/ instead of the one `orca serve`
# ships; see web-bundle/README.md.
absolute_redirect off;
client_max_body_size 0;
# ready.sh writes $orca_pairing from the runtime's pairing URL.
include "${STATIONDESK_STATE}/orca/pairing.conf";
location = /stationdesk-porthole.js {
    alias ${STATIONDESK_ROOT}/hub/web/assets/porthole.js;
}
location = /accounts/status.json {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT_HUB};
}
# Porthole needs only card previews; other monitor data stays on the hub.
location /monitor/ { return 404; }
location = /monitor/api/owner/messages/preview {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT_HUB};
}
# Zero-paste entry: a document navigation opens the patched client carrying the
# pairing; a WebSocket upgrade to / is the runtime RPC and goes to the backend.
location = / {
    if ($$http_upgrade !~* "^websocket$$") { return 302 /orca-web/web-index.html$$orca_pairing; }
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT};
    proxy_http_version 1.1;
    # Host stays $$host here, unlike location / below. Orca verifies Origin on
    # this websocket route; do not unify the two without a live handshake test.
    # No X-Forwarded-* either: rewriting the forwarded host breaks that check.
    proxy_set_header Host $$host;
    proxy_set_header Upgrade $$http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
}
location = /web-index.html {
    return 302 /orca-web/web-index.html$$is_args$$args;
}
location = /orca-web/web-index.html {
    alias ${STATIONDESK_APP_DIR}/web-bundle/dist/web-index.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    sub_filter '</body>' '<script src="/stationdesk-porthole.js" data-anchor="bottom-right" data-hub-url="https://${STATIONDESK_FQDN}" defer></script></body>';
    sub_filter_once on;
}
location /orca-web/assets/ {
    alias ${STATIONDESK_APP_DIR}/web-bundle/dist/assets/;
    access_log off;
}
# Optional local-browser sidecar, installed separately. The slot manager owns its
# runtime and config; only its five public operations are exposed here.
location = /orca-web/orca-local-browse.json {
    alias /opt/orca-web/orca-local-browse.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}
location = /orca-web/__orca-local-browse/allocate {
    proxy_pass http://127.0.0.1:18929/allocate;
    proxy_set_header Host $$host;
}
location = /orca-web/__orca-local-browse/heartbeat {
    proxy_pass http://127.0.0.1:18929/heartbeat;
    proxy_set_header Host $$host;
}
location = /orca-web/__orca-local-browse/allocate-external {
    proxy_pass http://127.0.0.1:18929/allocate-external;
    proxy_set_header Host $$host;
    proxy_read_timeout 6s;
}
location = /orca-web/__orca-local-browse/heartbeat-external {
    proxy_pass http://127.0.0.1:18929/heartbeat-external;
    proxy_set_header Host $$host;
}
location = /orca-web/__orca-local-browse/probe {
    proxy_pass http://127.0.0.1:18929/probe;
    proxy_set_header Host $$host;
    proxy_read_timeout 6s;
}
location / {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT};
    proxy_http_version 1.1;
    # $$http_host keeps the entrance port, which the browser's Origin carries.
    proxy_set_header Host $$http_host;
    proxy_set_header Upgrade $$http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_set_header Accept-Encoding "";
    sub_filter '</body>' '<script src="/stationdesk-porthole.js" data-anchor="bottom-right" data-hub-url="https://${STATIONDESK_FQDN}" defer></script></body>';
    sub_filter_once on;
}
