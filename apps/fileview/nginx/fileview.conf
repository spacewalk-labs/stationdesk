# Only the viewer's API routes are exposed. Filebrowser shares and its UI have no route.
location ~ ^/fileview/api/(login$|(?:resources|raw|search)(?:/|$)) {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT_FILEVIEW};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
    client_max_body_size 0;
}
location = /fileview/ {
    root ${STATIONDESK_ROOT}/web/fileview;
    try_files /viewer.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
}
location /fileview/static/ {
    alias ${STATIONDESK_ROOT}/web/fileview/static/;
    add_header Cache-Control "no-cache" always;
}
location = /fileview/icon.svg {
    alias ${STATIONDESK_ROOT}/web/fileview/icon.svg;
}
location /fileview/ {
    return 404;
}
