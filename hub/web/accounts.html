<!doctype html>
<html lang="en" data-theme="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n-ko="계정 · StationDesk">Accounts · StationDesk</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/stationdesk-tokens.css"><link rel="stylesheet" href="/assets/accounts.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--stationdesk-canvas);color:var(--stationdesk-ink);font:var(--stationdesk-fs-body)/1.5 var(--stationdesk-font);-webkit-font-smoothing:antialiased}main{max-width:560px;margin:auto;padding:40px 20px}a{color:var(--stationdesk-mute);font-size:var(--stationdesk-fs-sm);text-decoration:none}.home-link{display:inline-flex;align-items:center;gap:8px;min-height:44px}.home-link img{width:24px;height:24px}h1{margin:12px 0 4px;font-size:var(--stationdesk-fs-h1);letter-spacing:var(--stationdesk-track)}main>p{margin:0 0 20px;color:var(--stationdesk-mute);font-size:var(--stationdesk-fs-sm)}.acc-embedded main{display:none}</style><script src="/assets/i18n.js"></script><script src="/assets/porthole.js"></script><script src="/assets/accounts.js"></script></head><body><main><a class="home-link" href="/"><img src="/assets/favicon.svg" alt=""><span data-i18n-ko="← 홈">← Home</span></a><h1 data-i18n-ko="에이전트 계정">Agent accounts</h1><p data-i18n-ko="자격 증명은 각 에이전트 CLI 만 보관합니다.">Only each agent’s CLI keeps its credentials.</p><div id="accounts" aria-live="polite"></div></main><script>
// The Porthole panel opens /accounts/?agent=<id>&do=login|logout and shows only that sheet.
const query = new URLSearchParams(location.search);
const agent = query.get('agent'), operation = query.get('do');
if (agent && (operation === 'login' || operation === 'logout')) {
  document.documentElement.classList.add('acc-embedded');
  document.documentElement.dataset.theme = 'dark';
  StationDeskAccounts.load().catch(() => {}).then(() => StationDeskAccounts.openSheet(agent, operation));
} else {
  StationDeskAccounts.mountList(document.getElementById('accounts'));
}
</script></body></html>
