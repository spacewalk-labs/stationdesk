location / {
    root ${STATIONDESK_ROOT}/web/hub;
    index index.html;
}

location /hub/ {
    alias ${STATIONDESK_ROOT}/web/hub/;
}

location = /accounts/ {
    rewrite ^ /hub/accounts.html last;
}

# This box's tab-icon colour (porthole.js); absent = 404 = no colour.
location = /stationdesk-frame.json {
    alias ${STATIONDESK_ROOT}/state/frame.json;
    log_not_found off;   # no colour chosen is the normal case
}
