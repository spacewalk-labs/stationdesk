# Rendered for the Tailscale Funnel endpoint (see install.sh). Public by design, so it
# serves only the dedicated snapshot directories, never the private share directory.
# No autoindex: a directory without index.html is a 404. Search engines are told no,
# except for a snapshot whose owner turned indexing on (it has a .indexable file).
absolute_redirect off;
set $slug "";
if ($uri ~ "^/([a-z0-9][a-z0-9-]{2,63})(/|$)") { set $slug $1; }
set $robots "noindex, nofollow";
if (-f ${STATIONDESK_STATE}/publish/public/$slug/.indexable) { set $robots "all"; }
add_header X-Robots-Tag $robots always;
location @none { return 404; }
location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\n";
}
location ~ /\. { return 404; }
rewrite "^/([a-z0-9][a-z0-9-]{2,63})$" /$1/ permanent;
location / {
    root ${STATIONDESK_STATE}/publish/public;
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag $robots always;
}
location ~ "^/g/(?<gslug>[a-z0-9][a-z0-9-]{2,63})(?<gpath>/.*)?$" {
    if (!-d ${STATIONDESK_STATE}/publish/gated/$gslug) { return 404; }
    auth_basic "Restricted document";
    auth_basic_user_file ${STATIONDESK_STATE}/publish/htpasswd/$gslug.htpasswd;
    alias ${STATIONDESK_STATE}/publish/gated/$gslug$gpath;
    index index.html;
    error_page 403 =404 @none;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
