location = /cad {
    absolute_redirect off;
    return 302 /cad/;
}
location /cad/api/ {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT};
    proxy_set_header Host $http_host;
    proxy_read_timeout 65s;
    client_max_body_size 256m;
    add_header Cache-Control "no-store" always;
}
location /cad/ {
    alias ${STATIONDESK_ROOT}/web/cad/;
    index index.html;
    types { text/html html; text/css css; image/svg+xml svg; image/png png; application/wasm wasm; application/javascript js; text/plain txt; }
    add_header Cache-Control "no-store" always;
}
