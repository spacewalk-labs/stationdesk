add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self' https://${STATIONDESK_FQDN}; frame-ancestors 'self'; form-action 'none'; base-uri 'self'" always;
add_header X-Content-Type-Options nosniff always;
location = /stationdesk-porthole.js {
    alias ${STATIONDESK_ROOT}/hub/web/assets/porthole.js;
}
location = /stationdesk-bench.js {
    alias ${STATIONDESK_ROOT}/apps/bench/browser.js;
}
location = /stationdesk-bench.html {
    alias ${STATIONDESK_ROOT}/apps/bench/browser.html;
    sub_filter '</body>' '<script src="/stationdesk-porthole.js" data-hub-url="https://${STATIONDESK_FQDN}" defer></script></body>';
    sub_filter_once on;
}
location = /accounts/status.json {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT_HUB};
}
# Porthole needs only card previews; other monitor data stays on the hub.
location /monitor/ { return 404; }
location = /monitor/api/owner/messages/preview {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT_HUB};
}
location / {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT};
    proxy_set_header Accept-Encoding "";
    sub_filter '</head>' '<script src="/stationdesk-bench.js"></script></head>';
    sub_filter '</body>' '<script src="/stationdesk-porthole.js" data-hub-url="https://${STATIONDESK_FQDN}" defer></script></body>';
    sub_filter_once on;
}
