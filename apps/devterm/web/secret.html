<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret drop</title>
<!-- Secret drop without a terminal: Porthole opens this in its panel on other pages.
     Delivery is a clipboard copy of the path token; the value never leaves this box. -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  html, body { margin: 0; background: #1b1f29; color: #f2f5fa; font: 14px system-ui; }
  #secret { padding: 14px 16px 18px; }
  #status { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 90vw;
            padding: 8px 14px; border-radius: 8px; background: #2b303b; color: #f2f5fa; font: 13px system-ui; }
  #status.status-error { background: #4a2a2a; color: #ffb4ad; }
</style>
</head>
<body>
<div id="secret"></div>
<div id="status" role="status" aria-live="polite" hidden></div>
<script src="ui.js"></script>
<script src="secretdrop.js"></script>
<script src="secret.js"></script>
</body>
</html>
