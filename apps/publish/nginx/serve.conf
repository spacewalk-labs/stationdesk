# Built-in document assets first; a share that carries its own _assets/ (documents made
# before StationDesk, e.g. legacy-doc.css) keeps serving them.
location /_assets/ {
    alias ${STATIONDESK_APP_DIR}/share-docs/assets/;
    error_page 404 = @share_assets;
}
location @share_assets {
    root ${STATIONDESK_SHARE};
}
location = /stationdesk-tokens.css {
    alias ${STATIONDESK_ROOT}/hub/web/assets/stationdesk-tokens.css;
    default_type text/css;
    add_header Cache-Control "no-cache" always;
}
location = /stationdesk-index.css {
    alias ${STATIONDESK_ROOT}/hub/web/assets/publish-index.css;
    default_type text/css;
    add_header Cache-Control "no-cache" always;
}
location = /stationdesk-index.js {
    alias ${STATIONDESK_ROOT}/hub/web/assets/publish-index.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
}
location = /stationdesk-porthole.js {
    alias ${STATIONDESK_ROOT}/hub/web/assets/porthole.js;
    default_type application/javascript;
}
location = /accounts/status.json {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT_HUB};
}
# Porthole needs only card previews; other monitor data stays on the hub.
location /monitor/ { return 404; }
location = /monitor/api/owner/messages/preview {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT_HUB};
}
# Root is always the live directory listing; nested bundles retain index.html.
location = / {
    root ${STATIONDESK_SHARE};
    absolute_redirect off;
    index .stationdesk-live-directory-index;
    autoindex on;
    add_header Cache-Control "no-cache" always;
    sub_filter '</head>' '<link rel="stylesheet" href="/stationdesk-tokens.css"><link rel="stylesheet" href="/stationdesk-index.css"></head>';
    sub_filter '</body>' '<script src="/stationdesk-index.js" defer></script><script src="/stationdesk-porthole.js" data-mode="corner" data-hub-url="https://${STATIONDESK_FQDN}" defer></script></body>';
    sub_filter_once on;
}
location / {
    root ${STATIONDESK_SHARE};
    absolute_redirect off;
    index index.html;
    # Publish counts document views from this log (assets and the root listing are other locations).
    access_log "${STATIONDESK_STATE}/publish/views.log" publish_views;
    access_log "${STATIONDESK_STATE}/nginx-access.log";
    autoindex on;
    add_header Cache-Control "no-cache" always;
    sub_filter '</body>' '<script src="/stationdesk-porthole.js" data-mode="corner" data-hub-url="https://${STATIONDESK_FQDN}" defer></script></body>';
    sub_filter_once on;
}
