# Include this server in YOUR user nginx http context. Configure public TLS / DNS
# separately. Using this file means you configured your own target, so StationDesk
# opens no Tailscale Funnel; the built-in Funnel default applies only without one.
# Replace /opt/stationdesk if installed elsewhere, and choose your listen address.
server {
    listen 127.0.0.1:19928;
    server_name _;
    location / {
        root /opt/stationdesk/share-public;
        index index.html;
        add_header Cache-Control "no-store" always;
    }
    location ~ "^/g/(?<gslug>[a-z0-9][a-z0-9-]{2,63})(?<gpath>/.*)?$" {
        if (!-d /opt/stationdesk/share-gated/$gslug) { return 404; }
        auth_basic "Restricted document";
        auth_basic_user_file /opt/stationdesk/publish-gated-auth/$gslug.htpasswd;
        alias /opt/stationdesk/share-gated/$gslug$gpath;
        index index.html;
        add_header Cache-Control "no-store" always;
    }
}
