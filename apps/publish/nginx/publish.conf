location = /publish {
    absolute_redirect off;
    return 302 /publish/;
}
location /publish/api/ {
    proxy_pass http://127.0.0.1:${STATIONDESK_PORT}/;
    proxy_set_header Host $http_host;
    # 50 MiB file -> 4 * ceil(52428800 / 3) = 69905068 base64 bytes, plus JSON.
    client_max_body_size 70m;
}
location /publish/files/ {
    # Shared documents execute on the document port, outside the owner API origin.
    # Capture the original escaped URI: rewrite captures would turn %3F into a query.
    if ($$request_uri ~ ^/publish/files(/.*)$$) {
        return 302 https://${STATIONDESK_FQDN}:8000$$1;
    }
    return 404;
}
location /publish/ {
    alias ${STATIONDESK_ROOT}/web/publish/;
    index index.html;
}
# Built-in document assets first; a share that carries its own _assets/ (documents made
# before StationDesk, e.g. legacy-doc.css) keeps serving them.
location /_assets/ {
    alias ${STATIONDESK_APP_DIR}/share-docs/assets/;
    error_page 404 = @share_assets;
}
location @share_assets {
    return 302 https://${STATIONDESK_FQDN}:8000$$request_uri;
}
