server {
    listen 127.0.0.1:19920;
    server_name _;
    if ($http_tailscale_user_login != "owner@example.test") { return 403; }
    error_page 403 =403 @wrong_owner;
    location @wrong_owner {
        # Static error pages reject POST with 405; preserve the owner denial.
        if ($request_method !~ "^(GET|HEAD)$") { return 403 "Owner access required"; }
        root "/opt/stationdesk/web/hub";
        try_files /wrong-owner.html =403;
    }
    include "/opt/stationdesk/nginx/apps.d/hub.conf";
    include "/opt/stationdesk/nginx/apps.d/hello.conf";
}
